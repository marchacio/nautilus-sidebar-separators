<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #242424; rx: 12px; }
      .sidebar-bg { fill: #1e1e1e; }
      .header-bg { fill: #2e2e2e; }
      .win-btn-close { fill: #e55c5c; }
      .win-btn-min { fill: #e5c35c; }
      .win-btn-max { fill: #5ce578; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .text-sep { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #8a8a8a; }
      .sep-line { stroke: #3a3a3a; stroke-width: 1.5; stroke-linecap: round; }
      .text-item { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #dedede; }
      .item-icon { fill: #78aeed; }
      .item-icon-star { fill: #f8e45c; }
      .item-icon-home { fill: #9a9996; }
      .item-active { fill: #3584e4; rx: 6px; }
      .text-active { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #ffffff; }
      .main-empty { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5e5e5e; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="720" height="440" class="window-bg" />

  <!-- Header Bar -->
  <path d="M0,12 Q0,0 12,0 L708,0 Q720,0 720,12 L720,44 L0,44 Z" class="header-bg" />
  <circle cx="20" cy="22" r="6" class="win-btn-close" />
  <circle cx="38" cy="22" r="6" class="win-btn-min" />
  <circle cx="56" cy="22" r="6" class="win-btn-max" />
  <text x="360" y="27" text-anchor="middle" class="text-title">Files — Projects</text>

  <!-- Sidebar Background -->
  <path d="M0,44 L250,44 L250,440 L12,440 Q0,440 0,428 Z" class="sidebar-bg" />
  <line x1="250" y1="44" x2="250" y2="440" stroke="#161616" stroke-width="1" />

  <!-- Standard Sidebar Items -->
  <g transform="translate(16, 60)">
    <polygon points="12,3 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" class="item-icon-star" transform="scale(0.8) translate(0, 2)" />
    <text x="32" y="16" class="text-item">Starred</text>
  </g>
  <g transform="translate(16, 92)">
    <path d="M4,17 L4,9 L10,3 L16,9 L16,17 Z" class="item-icon-home" transform="scale(0.8) translate(2, 2)" />
    <text x="32" y="16" class="text-item">Home</text>
  </g>
  <g transform="translate(16, 124)">
    <rect x="2" y="4" width="16" height="12" rx="2" class="item-icon" />
    <text x="32" y="16" class="text-item">Documents</text>
  </g>

  <!-- SEPARATOR 1: WORK -->
  <g transform="translate(16, 162)">
    <text x="6" y="14" class="text-sep">WORK</text>
    <line x1="58" y1="10" x2="218" y2="10" class="sep-line" />
  </g>

  <!-- Items under WORK -->
  <g transform="translate(16, 186)">
    <rect x="2" y="4" width="16" height="12" rx="2" class="item-icon" />
    <text x="32" y="16" class="text-item">Thesis</text>
  </g>
  <g transform="translate(16, 218)">
    <rect x="2" y="4" width="16" height="12" rx="2" class="item-icon" />
    <text x="32" y="16" class="text-item">University</text>
  </g>

  <!-- SEPARATOR 2: PROJECTS -->
  <g transform="translate(16, 258)">
    <text x="6" y="14" class="text-sep">PROJECTS</text>
    <line x1="84" y1="10" x2="218" y2="10" class="sep-line" />
  </g>

  <!-- Items under PROJECTS -->
  <g transform="translate(16, 282)">
    <rect x="0" y="0" width="220" height="28" class="item-active" />
    <rect x="10" y="8" width="16" height="12" rx="2" fill="#ffffff" />
    <text x="36" y="19" class="text-active">Project Alpha</text>
  </g>
  <g transform="translate(16, 316)">
    <rect x="2" y="4" width="16" height="12" rx="2" class="item-icon" />
    <text x="32" y="16" class="text-item">Project Beta</text>
  </g>

  <!-- SEPARATOR 3: MEDIA -->
  <g transform="translate(16, 356)">
    <text x="6" y="14" class="text-sep">MEDIA</text>
    <line x1="62" y1="10" x2="218" y2="10" class="sep-line" />
  </g>
  <g transform="translate(16, 380)">
    <rect x="2" y="4" width="16" height="12" rx="2" class="item-icon" />
    <text x="32" y="16" class="text-item">Podcasts</text>
  </g>

  <!-- Main View Area Content -->
  <g transform="translate(300, 80)">
    <!-- Folder Grid Item 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="70" height="56" rx="6" fill="#3584e4" opacity="0.8" />
      <text x="35" y="74" text-anchor="middle" class="text-item">src</text>
    </g>
    <!-- Folder Grid Item 2 -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="70" height="56" rx="6" fill="#3584e4" opacity="0.8" />
      <text x="35" y="74" text-anchor="middle" class="text-item">docs</text>
    </g>
    <!-- Folder Grid Item 3 -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="70" height="56" rx="6" fill="#3584e4" opacity="0.8" />
      <text x="35" y="74" text-anchor="middle" class="text-item">assets</text>
    </g>
    <!-- File Grid Item 4 -->
    <g transform="translate(0, 110)">
      <rect x="6" y="0" width="58" height="66" rx="4" fill="#444444" />
      <text x="35" y="84" text-anchor="middle" class="text-item">README.md</text>
    </g>
  </g>
</svg>
